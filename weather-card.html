<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气查询卡片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: #667eea;
        }

        .search-box button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        .weather-info {
            text-align: center;
            display: none;
        }

        .weather-info.active {
            display: block;
        }

        .city-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .date {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 80px;
            margin: 20px 0;
        }

        .temperature {
            font-size: 64px;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        .description {
            font-size: 20px;
            color: #666;
            text-transform: capitalize;
            margin-bottom: 30px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .error-message {
            text-align: center;
            color: #e74c3c;
            padding: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .weather-card {
                padding: 20px;
            }

            .temperature {
                font-size: 48px;
            }

            .details {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="weather-card">
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="输入城市名称..." value="北京">
            <button onclick="getWeather()">查询</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在加载天气信息...</p>
        </div>

        <div class="error-message" id="errorMessage">
            <p>❌ 无法获取天气信息，请检查城市名称或网络连接</p>
        </div>

        <div class="weather-info" id="weatherInfo">
            <h2 class="city-name" id="cityName">北京</h2>
            <p class="date" id="currentDate"></p>
            <div class="weather-icon" id="weatherIcon">☀️</div>
            <div class="temperature" id="temperature">25°C</div>
            <p class="description" id="description">晴朗</p>
            
            <div class="details">
                <div class="detail-item">
                    <p class="detail-label">湿度</p>
                    <p class="detail-value" id="humidity">60%</p>
                </div>
                <div class="detail-item">
                    <p class="detail-label">风速</p>
                    <p class="detail-value" id="windSpeed">15 km/h</p>
                </div>
                <div class="detail-item">
                    <p class="detail-label">体感温度</p>
                    <p class="detail-value" id="feelsLike">27°C</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟天气数据（实际使用时可以替换为真实的 API 调用）
        const mockWeatherData = {
            '北京': { temp: 25, feels_like: 27, humidity: 60, wind_speed: 15, description: '晴朗', icon: '☀️' },
            '上海': { temp: 28, feels_like: 31, humidity: 75, wind_speed: 12, description: '多云', icon: '⛅' },
            '广州': { temp: 32, feels_like: 36, humidity: 80, wind_speed: 8, description: '炎热', icon: '🌡️' },
            '深圳': { temp: 31, feels_like: 35, humidity: 78, wind_speed: 10, description: '晴天', icon: '☀️' },
            '成都': { temp: 22, feels_like: 23, humidity: 65, wind_speed: 5, description: '阴天', icon: '☁️' },
            '杭州': { temp: 26, feels_like: 28, humidity: 70, wind_speed: 11, description: '小雨', icon: '🌧️' },
            '武汉': { temp: 29, feels_like: 32, humidity: 72, wind_speed: 13, description: '多云', icon: '⛅' },
            '西安': { temp: 24, feels_like: 25, humidity: 55, wind_speed: 9, description: '晴朗', icon: '☀️' },
            '南京': { temp: 27, feels_like: 29, humidity: 68, wind_speed: 10, description: '晴间多云', icon: '⛅' },
            '重庆': { temp: 30, feels_like: 34, humidity: 76, wind_speed: 7, description: '闷热', icon: '🌡️' }
        };

        // 获取当前日期
        function getCurrentDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            return now.toLocaleDateString('zh-CN', options);
        }

        // 显示加载状态
        function showLoading() {
            document.getElementById('loading').classList.add('active');
            document.getElementById('weatherInfo').classList.remove('active');
            document.getElementById('errorMessage').classList.remove('active');
        }

        // 隐藏加载状态
        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }

        // 显示错误信息
        function showError() {
            hideLoading();
            document.getElementById('weatherInfo').classList.remove('active');
            document.getElementById('errorMessage').classList.add('active');
        }

        // 显示天气信息
        function showWeather(data, city) {
            hideLoading();
            document.getElementById('errorMessage').classList.remove('active');
            
            document.getElementById('cityName').textContent = city;
            document.getElementById('currentDate').textContent = getCurrentDate();
            document.getElementById('temperature').textContent = `${data.temp}°C`;
            document.getElementById('description').textContent = data.description;
            document.getElementById('weatherIcon').textContent = data.icon;
            document.getElementById('humidity').textContent = `${data.humidity}%`;
            document.getElementById('windSpeed').textContent = `${data.wind_speed} km/h`;
            document.getElementById('feelsLike').textContent = `${data.feels_like}°C`;
            
            document.getElementById('weatherInfo').classList.add('active');
        }

        // 获取天气信息
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            
            if (!city) {
                alert('请输入城市名称');
                return;
            }

            showLoading();

            try {
                // 模拟 API 请求延迟
                await new Promise(resolve => setTimeout(resolve, 800));

                // 查找模拟数据（不区分大小写）
                const weatherData = mockWeatherData[city] || mockWeatherData[Object.keys(mockWeatherData).find(key => key.toLowerCase() === city.toLowerCase())];

                if (weatherData) {
                    showWeather(weatherData, city);
                } else {
                    // 如果没有找到匹配的城市，生成随机数据用于演示
                    const randomWeather = {
                        temp: Math.floor(Math.random() * 35) + 5,
                        feels_like: Math.floor(Math.random() * 35) + 7,
                        humidity: Math.floor(Math.random() * 40) + 40,
                        wind_speed: Math.floor(Math.random() * 30) + 5,
                        description: ['晴朗', '多云', '阴天', '小雨', '中雨'][Math.floor(Math.random() * 5)],
                        icon: ['☀️', '⛅', '☁️', '🌧️', '⛈️'][Math.floor(Math.random() * 5)]
                    };
                    showWeather(randomWeather, city);
                }
            } catch (error) {
                console.error('获取天气失败:', error);
                showError();
            }
        }

        // 支持回车键搜索
        document.getElementById('cityInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                getWeather();
            }
        });

        // 页面加载时自动查询默认城市
        window.onload = function() {
            getWeather();
        };
    </script>
</body>
</html>
